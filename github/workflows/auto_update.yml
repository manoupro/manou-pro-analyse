name: Actualisation Automatique Manou Pro Analyse

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code du site
        uses: actions/checkout@v3

      - name: Installer Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Lancer le script d'automatisation
        run: python update_matches.py

      - name: Sauvegarder les modifications sur le site
        run: |
          git config --global user.name 'Bot Manou Pro'
          git config --global user.email 'bot@manoupro.com'
          git add .
          git diff --quiet && git diff --staged --quiet || (git commit -m "Mise à jour automatique des analyses" && git push)
